name: Publishing test dependencies
description: Configure local Chrome and real document conversion tools for Linux CI.
runs:
  using: composite
  steps:
    - name: Install Chrome for Testing
      id: chrome
      uses: browser-actions/setup-chrome@48ad923757ca74d66703209fe939badbdf80f2f4 # v2
      with:
        chrome-version: "155.0.8059.39"
        install-dependencies: true
    - name: Cache Tectonic resources
      uses: actions/cache@v4
      with:
        path: ~/.cache/Tectonic
        key: tectonic-${{ runner.os }}-0.17.0-pandoc-3.12-v1
    - name: Install publishing tools
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TEST_CHROME_PATH: ${{ steps.chrome.outputs.chrome-path }}
      run: bash "$ACTION_PATH/setup.sh"
