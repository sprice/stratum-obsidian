name: Build & Lint

on:
  push:
    branches: ["master"]
    tags: ["*"]
  pull_request:
    branches: ["**"]

  workflow_dispatch:
    inputs:
      uncached:
        description: Run validation without reading or writing task caches
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The setup action opts eligible runs into GitHub caching via GITHUB_ENV.
      WIREIT_CACHE: none
      WIREIT_LOGGER: simple

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - uses: ./.github/actions/setup-publishing-tests
      - run: pnpm install --frozen-lockfile
      - name: Enable validation caching
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.uncached != true && vars.STRATUM_CI_CACHE_DISABLED != 'true' }}
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2
      - run: pnpm ci:prepare
      - run: pnpm test:publishing:preflight
        timeout-minutes: 5
      - run: pnpm ci:test-tooling
      - run: pnpm ci:format
      - name: Obsidian lint (no errors or warnings)
        run: pnpm ci:lint-review
      - name: Scorecard CSS, base64, and type compatibility
        run: pnpm ci:scorecard
      - run: pnpm test
      - run: pnpm test:browser
        if: ${{ !cancelled() }}
        timeout-minutes: 3
      - name: Upload publishing test artifacts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: publishing-tests
          path: .test-artifacts/publishing/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14
      - run: pnpm ci:typecheck
      - run: pnpm build

  release:
    name: Release Obsidian plugin
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22.x"
          cache: "pnpm"

      - name: Verify release version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const manifest = JSON.parse(readFileSync("manifest.json", "utf8"));
            if (manifest.version !== process.env.GITHUB_REF_NAME) {
              throw new Error("Release tag must match manifest.json version");
            }
          '

      - run: pnpm install --frozen-lockfile

      - name: Build plugin
        run: pnpm build

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            main.js
            manifest.json
            styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          gh release create "$tag" \
            --title="$tag" \
            --draft \
            main.js manifest.json styles.css
