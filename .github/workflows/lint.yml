name: Build & Lint

on:
  push:
    branches: ["master"]
    tags: ["*"]
  pull_request:
    branches: ["**"]

  workflow_dispatch:
    inputs:
      uncached:
        description: Run validation without local receipts or task caches
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      # The setup action opts eligible runs into GitHub caching via GITHUB_ENV.
      WIREIT_CACHE: none
      WIREIT_LOGGER: simple
      # Bound CPU/memory contention while allowing independent checks to overlap.
      WIREIT_PARALLEL: 2
      WIREIT_FAILURES: continue

    strategy:
      matrix:
        node-version: [22.x]

    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: "pnpm"
      - name: Inspect local validation
        id: local-validation
        if: ${{ inputs.uncached != true && vars.STRATUM_CI_CACHE_DISABLED != 'true' }}
        run: node scripts/ci-local-validation.mjs
      - uses: ./.github/actions/setup-publishing-tests
        if: steps.local-validation.outputs.validated != 'true'
      - run: pnpm install --frozen-lockfile
      - name: Enable validation caching
        if: ${{ steps.local-validation.outputs.validated != 'true' && inputs.uncached != true && vars.STRATUM_CI_CACHE_DISABLED != 'true' }}
        uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2
      - name: Check plugin (cached tasks)
        if: steps.local-validation.outputs.validated != 'true'
        run: pnpm ci:check
        env:
          STRATUM_RELEASE_BUILD: ${{ startsWith(github.ref, 'refs/tags/') && format('{0}-{1}', github.run_id, github.run_attempt) || '' }}
        timeout-minutes: 12
      - name: Bundle locally validated plugin
        if: steps.local-validation.outputs.validated == 'true'
        run: node scripts/run-quiet.mjs node esbuild.config.mjs production
      - name: Verify release metadata
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: node scripts/release-metadata.mjs "$GITHUB_REF_NAME"
      - name: Upload release assets
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: plugin-release-assets
          overwrite: true
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
      - name: Upload publishing test artifacts
        if: ${{ always() && steps.local-validation.outputs.validated != 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: publishing-tests
          path: .test-artifacts/publishing/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  release:
    name: Release Obsidian plugin
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Download validated release assets
        uses: actions/download-artifact@v4
        with:
          name: plugin-release-assets
          path: release-assets

      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            release-assets/main.js
            release-assets/manifest.json
            release-assets/styles.css

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"

          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            if [ "$draft" != "true" ]; then
              echo "Refusing to replace assets on a published release" >&2
              exit 1
            fi
            gh release upload "$tag" --clobber \
              release-assets/main.js release-assets/manifest.json release-assets/styles.css
          else
            gh release create "$tag" \
              --verify-tag \
              --title="$tag" \
              --draft \
              release-assets/main.js release-assets/manifest.json release-assets/styles.css
          fi
